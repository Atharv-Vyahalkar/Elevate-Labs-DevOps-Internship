
name: Node.js CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'Task-01-CICD-Pipeline/**'
      - '.github/workflows/main.yml'

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      
      - name: Checkout repository
        uses: actions/checkout@v4

      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Task-01-CICD-Pipeline/package-lock.json

      
      - name: Install dependencies
        working-directory: Task-01-CICD-Pipeline
        run: npm ci

      
      - name: Run tests
        working-directory: Task-01-CICD-Pipeline
        run: npm test

      
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./Task-01-CICD-Pipeline
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-node-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-node-app:${{ github.sha }}
